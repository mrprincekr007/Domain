<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#060a14">
  <title>SubManga Admin — Cloudflare Config</title>
  <link rel="stylesheet" href="css/admin.css?v=4">
</head>
<body data-admin-page="cfconfig">
  <div class="aurora">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
    <div class="blob blob-4"></div>
  </div>

  <div class="layout">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main-area">
      <header class="topbar" id="topbar"></header>
      <div class="content">
        <div class="card">
          <h2 style="font-size:16px;margin-bottom:4px">Cloudflare API Configuration</h2>
            <p style="font-size:12.5px;color:var(--muted-fg);margin:0 0 14px">Admin only. Hidden in the user panel.</p>
          <div style="display:flex;align-items:center;gap:9px;margin-bottom:14px">
            <span id="connDot" style="width:10px;height:10px;border-radius:50%;background:var(--faint)"></span>
            <span id="connLabel" style="font-size:13px;color:var(--muted-fg)">Not configured</span>
          </div>
          <div class="callout" style="margin-bottom:14px">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" width="19" height="19"><circle cx="12" cy="12" r="9"/><path stroke-linecap="round" d="M12 16v-4m0-4h.01"/></svg>
              <div><strong>Deploy the Worker first:</strong> paste <code>worker.js</code> on <a href="https://dash.cloudflare.com/" target="_blank" style="color:var(--c1)">Cloudflare Workers</a>, set <code>DNS_PROXY_TOKEN</code>.</div>
          </div>
          <div class="form-group">
            <label>Worker URL</label>
            <input class="input" id="cfWorker" type="url" placeholder="https://subdomain.YOUR_SUBDOMAIN.workers.dev">
          </div>
          <div class="form-group">
            <label>Zone ID</label>
            <input class="input" id="cfZone" type="text" placeholder="Paste the Zone ID here">
            <div class="hint">Cloudflare Dashboard &rarr; select domain &rarr; Zone ID is in the right sidebar</div>
          </div>
          <div style="display:flex;gap:9px;flex-wrap:wrap">
            <button class="btn btn-primary" id="cfSave">Save Config</button>
            <button class="btn btn-ghost" id="cfTest">Test Connection</button>
            <button class="btn btn-ghost" id="cfReset">Reset Config</button>
          </div>
          <div id="cfStatus" style="margin-top:10px;font-size:12.5px;display:none"></div>
        </div>

        <div class="card" style="margin-top:16px">
          <h2 style="font-size:16px;margin-bottom:4px">Quick Deploy (Admin)</h2>
            <p style="font-size:12.5px;color:var(--muted-fg);margin:0 0 14px">Direct CNAME + app save.</p>
          <div class="grid-2" style="margin-bottom:12px">
            <div class="form-group" style="margin:0">
              <label>Subdomain Name</label>
              <div class="input-prefix">
                <span class="prefix" id="qdPrefix"></span>
                <input class="input" id="qdName" placeholder="blog, api, shop">
              </div>
            </div>
            <div class="form-group" style="margin:0">
              <label>GitHub Username</label>
                <input class="input" id="qdGithub" placeholder="e.g. princekr786">
            </div>
          </div>
          <button class="btn btn-primary" id="qdDeploy" style="width:100%">Deploy to Cloudflare DNS</button>
          <div id="qdResult" style="margin-top:12px;display:none">
            <pre id="qdOutput"></pre>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/firebase-init.js?v=4"></script>
  <script src="js/admin-app.js?v=4"></script>
  <script src="admin-main.js?v=4"></script>
</body>
</html>
