<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#060a14">
  <title>SubManga Admin — Dashboard</title>
  <link rel="stylesheet" href="css/admin.css?v=4">
</head>
<body data-admin-page="dashboard">
  <div class="aurora">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
    <div class="blob blob-4"></div>
  </div>

  <div class="layout">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main-area">
      <header class="topbar" id="topbar"></header>
      <div class="content">
        <div class="stats-grid" id="adminStats"></div>

        <div class="grid-2">
          <div class="card">
            <h2 style="font-size:16px;margin-bottom:4px">Growth — last 30 days</h2>
            <p style="font-size:12.5px;color:var(--muted-fg);margin:0 0 10px">Total subdomains over time</p>
            <div class="chart-container"><canvas id="sparkGrowth"></canvas></div>
          </div>
          <div class="card">
            <h2 style="font-size:16px;margin-bottom:4px">Activity — last 7 days</h2>
            <p style="font-size:12.5px;color:var(--muted-fg);margin:0 0 10px">Actions per day</p>
            <div class="chart-container"><canvas id="sparkActivity"></canvas></div>
          </div>
        </div>

        <div class="grid-2" style="margin-top:16px">
          <div class="card">
            <h2 style="font-size:16px;margin-bottom:12px">System Info</h2>
            <div id="systemInfo" style="font-size:13px;color:var(--muted-fg)"></div>
          </div>
          <div class="card">
            <h2 style="font-size:16px;margin-bottom:12px">Recent Activity</h2>
            <div id="recentActivity" style="font-size:12.5px;max-height:260px;overflow-y:auto"></div>
            <div style="margin-top:10px"><a class="btn btn-sm btn-ghost" href="activity.html">View full log</a></div>
          </div>
        </div>

        <div class="card" style="margin-top:16px">
          <h2 style="font-size:16px;margin-bottom:12px">Subdomains by Status</h2>
          <div id="statusBreakdown" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px"></div>
          <div style="margin-top:12px;display:flex;gap:9px;flex-wrap:wrap">
            <a class="btn btn-sm" href="subdomains.html">Manage subdomains</a>
            <a class="btn btn-sm btn-ghost" href="analytics.html">Open analytics</a>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/firebase-init.js?v=4"></script>
  <script src="js/admin-app.js?v=4"></script>
  <script src="js/admin-charts.js?v=4"></script>
  <script src="admin-main.js?v=4"></script>
</body>
</html>
