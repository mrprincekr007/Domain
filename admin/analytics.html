<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#060a14">
  <title>SubManga Admin — Analytics</title>
  <link rel="stylesheet" href="css/admin.css?v=4">
</head>
<body data-admin-page="analytics">
  <div class="aurora">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
    <div class="blob blob-4"></div>
  </div>

  <div class="layout">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main-area">
      <header class="topbar" id="topbar"></header>
      <div class="content">
        <div class="stats-grid" id="analyticsStats"></div>

        <div class="grid-2">
          <div class="card">
            <h2 style="font-size:16px;margin-bottom:4px">Subdomain Growth</h2>
            <p style="font-size:12.5px;color:var(--muted-fg);margin:0 0 10px">Last 30 days</p>
            <div class="chart-container"><canvas id="chartGrowth"></canvas></div>
          </div>
          <div class="card">
            <h2 style="font-size:16px;margin-bottom:4px">Activity by Day</h2>
            <p style="font-size:12.5px;color:var(--muted-fg);margin:0 0 10px">Last 7 days</p>
            <div class="chart-container"><canvas id="chartActivity"></canvas></div>
          </div>
        </div>

        <div class="grid-2" style="margin-top:16px">
          <div class="card">
            <h2 style="font-size:16px;margin-bottom:4px">Status Distribution</h2>
            <p style="font-size:12.5px;color:var(--muted-fg);margin:0 0 10px">Live / Pending / Draft</p>
            <div class="chart-container"><canvas id="chartDonut"></canvas></div>
          </div>
          <div class="card">
            <h2 style="font-size:16px;margin-bottom:4px">Actions Breakdown</h2>
            <p style="font-size:12.5px;color:var(--muted-fg);margin:0 0 10px">How many times each action happened</p>
            <div class="chart-container"><canvas id="chartActions"></canvas></div>
          </div>
        </div>

        <div class="grid-2" style="margin-top:16px">
          <div class="card">
            <h2 style="font-size:16px;margin-bottom:12px">Top 5 Active Subdomains</h2>
            <div id="topActive"></div>
          </div>
          <div class="card">
            <h2 style="font-size:16px;margin-bottom:12px">Timeline</h2>
            <div id="timelineInfo" style="font-size:13px;color:var(--muted-fg)"></div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/firebase-init.js?v=4"></script>
  <script src="js/admin-app.js?v=4"></script>
  <script src="js/admin-charts.js?v=4"></script>
  <script src="admin-main.js?v=4"></script>
</body>
</html>
