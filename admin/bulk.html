<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#060a14">
  <title>SubManga Admin — Bulk Operations</title>
  <link rel="stylesheet" href="css/admin.css?v=4">
</head>
<body data-admin-page="bulk">
  <div class="aurora">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
    <div class="blob blob-4"></div>
  </div>

  <div class="layout">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main-area">
      <header class="topbar" id="topbar"></header>
      <div class="content">
        <div class="card">
          <h2 style="font-size:16px;margin-bottom:4px">Bulk Operations</h2>
          <p style="font-size:12.5px;color:var(--muted-fg);margin:0 0 14px">Batch Deploy / Check / Delete.</p>
          <div style="display:flex;gap:9px;margin-bottom:12px;flex-wrap:wrap">
            <button class="btn btn-sm" id="selectAll">Select All</button>
            <button class="btn btn-sm btn-ghost" id="deselectAll">Deselect All</button>
            <span id="selectedCount" style="font-size:12.5px;color:var(--muted-fg);align-self:center">0 selected</span>
          </div>
          <div id="bulkList"></div>
          <div id="bulkProgress" style="display:none;margin-top:12px">
            <div style="font-size:12.5px;color:var(--muted-fg);margin-bottom:6px" id="bulkProgressLabel">Working...</div>
            <div class="progress-bar"><div class="progress-bar-fill" id="bulkProgressFill" style="width:0%"></div></div>
          </div>
          <div style="display:flex;gap:9px;margin-top:12px;flex-wrap:wrap">
            <button class="btn btn-primary" id="bulkDeploy" disabled>Deploy Selected to Cloudflare</button>
            <button class="btn btn-ghost" id="bulkCheck" disabled>Check DNS for Selected</button>
            <button class="btn btn-danger" id="bulkDelete" disabled>Delete Selected</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="js/firebase-init.js?v=4"></script>
  <script src="js/admin-app.js?v=4"></script>
  <script src="admin-main.js?v=4"></script>
</body>
</html>
