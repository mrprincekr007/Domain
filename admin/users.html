<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#060a14">
  <title>SubManga Admin — Users</title>
  <link rel="stylesheet" href="css/admin.css?v=4">
</head>
<body data-admin-page="users">
  <div class="aurora">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
    <div class="blob blob-4"></div>
  </div>

  <div class="layout">
    <aside class="sidebar" id="sidebar"></aside>
    <div class="main-area">
      <header class="topbar" id="topbar"></header>
      <div class="content">
        <div class="stats-grid" id="userStats"></div>

        <div class="card">
          <h2 style="font-size:16px;margin-bottom:4px">Grant credits</h2>
          <p style="font-size:12.5px;color:var(--muted-fg);margin:0 0 14px">Give or deduct credits.</p>
          <form id="grantForm">
            <div class="grid-2" style="margin-bottom:12px">
              <div class="form-group" style="margin:0">
                <label>User</label>
                <select class="input" id="grantUser"></select>
              </div>
              <div class="form-group" style="margin:0">
                <label>Amount (+/-)</label>
                <input class="input" id="grantAmount" type="number" placeholder="e.g. 50 or -20">
              </div>
            </div>
            <div class="form-group">
              <label>Note (optional)</label>
                <input class="input" id="grantNote" placeholder="e.g. Bonus, Refund">
            </div>
            <button class="btn btn-primary" type="submit" id="grantBtn">Grant credits</button>
          </form>
        </div>

        <div class="card" style="margin-top:16px">
          <h2 style="font-size:16px;margin-bottom:4px">All users</h2>
          <p style="font-size:12.5px;color:var(--muted-fg);margin:0 0 14px">Separate account per user.</p>
          <div class="toolbar">
            <div class="search-input">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-4.3-4.3M17 10.5a6.5 6.5 0 11-13 0 6.5 6.5 0 0113 0z"/></svg>
              <input id="userSearch" type="text" placeholder="Search username...">
            </div>
            <select class="select-input" id="userStatusFilter">
              <option value="all">All status</option>
              <option value="active">Active</option>
              <option value="blocked">Blocked</option>
              <option value="admin">Admins</option>
            </select>
            <select class="select-input" id="userSort">
              <option value="new">Newest first</option>
              <option value="old">Oldest first</option>
              <option value="az">Name A–Z</option>
              <option value="credits">Most credits</option>
            </select>
            <button class="btn btn-sm" id="refreshUsers">Refresh</button>
            <button class="btn btn-sm btn-ghost" id="exportUsers">Export CSV</button>
            <span id="userCount" style="font-size:12.5px;color:var(--muted-fg);align-self:center"></span>
          </div>
          <div id="usersTable"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- user detail modal -->
  <div id="modal-user" class="modal-backdrop">
    <div class="modal" style="max-width:560px">
      <div class="modal-head">
        <h3 id="detailTitle">User details</h3>
        <button class="modal-close" data-close="modal-user">✕</button>
      </div>
      <div id="userDetailBody"></div>
      <div class="form-actions">
        <button class="btn btn-ghost" data-close="modal-user">Close</button>
      </div>
    </div>
  </div>

  <script src="js/firebase-init.js?v=4"></script>
  <script src="js/admin-app.js?v=4"></script>
  <script src="js/auth.js?v=4"></script>
  <script src="admin-main.js?v=4"></script>
</body>
</html>
