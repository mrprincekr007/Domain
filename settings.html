<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b1120">
  <title>SubManga — Settings</title>
  <meta name="description" content="Manage your theme and data backup.">
  <link rel="stylesheet" href="css/styles.css?v=4">
</head>
<body>
  <div id="sidebar" class="sidebar"></div>

  <div class="layout">
    <div class="main">
      <header class="topbar">
        <div style="display:flex;align-items:center;gap:12px">
          <button id="hamburger" class="icon-btn hamburger" aria-label="Menu"></button>
          <div class="page-title">
            <h1>Settings</h1>
            <p>Manage your theme and backup</p>
          </div>
        </div>
        <div class="topbar-actions">
        </div>
      </header>

      <main class="main-content page">
        <div class="sub-grid stagger" style="grid-template-columns:1fr;max-width:100%">

          <!-- Domain (read-only, admin controlled) -->
          <div class="card">
            <h2 style="font-size:17px;margin-bottom:4px">Main domain</h2>
            <p style="font-size:13px;color:var(--muted-fg);margin:0 0 12px">All subdomains are created under it.</p>
            <div class="hero-domain" style="font-size:14px"><b id="domainDisplay"></b></div>
            <div class="hint" style="font-size:12px;color:var(--muted-fg);margin-top:10px">Changeable only in the admin panel.</div>
          </div>

          <!-- Data -->
          <div class="card">
            <h2 style="font-size:17px;margin-bottom:4px">Data &amp; backup</h2>
            <p style="font-size:13px;color:var(--muted-fg);margin:0 0 16px">Saved in this browser. Keep a backup.</p>
            <div style="display:flex;gap:10px;flex-wrap:wrap">
              <button class="btn" id="exportBtn">Export backup</button>
              <label class="btn" style="cursor:pointer">
                Import backup
                <input type="file" id="importFile" accept=".json" style="display:none">
              </label>
            </div>
          </div>

          <!-- Help -->
          <div class="card">
            <h2 style="font-size:17px;margin-bottom:4px">Help &amp; guides</h2>
            <p style="font-size:13px;color:var(--muted-fg);margin:0 0 16px">Step-by-step deploy guide.</p>
            <div style="display:flex;gap:10px;flex-wrap:wrap">
              <a class="btn" href="dns.html">DNS &amp; Deploy guide</a>
              <a class="btn btn-ghost" href="subdomains.html">My subdomains</a>
            </div>
          </div>

        </div>
      </main>
    </div>
  </div>

  <script src="js/firebase-init.js?v=4"></script>
  <script src="js/data.js?v=4"></script>
  <script src="js/auth.js?v=4"></script>
  <script src="js/app.js?v=4"></script>
  <script src="js/fx.js?v=4"></script>
  <script src="js/settings.js?v=4"></script>
</body>
</html>
