<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b1120">
  <title>SubManga — Subdomains</title>
  <meta name="description" content="Add, edit and delete your subdomains.">
  <link rel="stylesheet" href="css/styles.css?v=4">
</head>
<body>
  <div id="sidebar" class="sidebar"></div>

  <div class="layout">
    <div class="main">
      <header class="topbar">
        <div style="display:flex;align-items:center;gap:12px">
          <button id="hamburger" class="icon-btn hamburger" aria-label="Menu"></button>
          <div class="page-title">
            <h1>Subdomains</h1>
            <p id="domainLabel"></p>
          </div>
        </div>
        <div class="topbar-actions">
          <button class="btn btn-primary btn-sm" id="addBtn">
            <span style="display:inline-flex">+ Add</span>
          </button>
        </div>
      </header>

      <main class="main-content page">
        <!-- toolbar -->
        <div class="toolbar reveal">
          <div class="search-box">
            <span id="searchIcon"></span>
            <input type="text" id="search" placeholder="Search subdomains...">
          </div>
          <select class="select-input" id="filterStatus">
            <option value="all">All statuses</option>
            <option value="live">Live</option>
            <option value="pending">Pending</option>
            <option value="draft">Draft</option>
          </select>
          <select class="select-input" id="sortBy">
            <option value="new">Newest first</option>
            <option value="old">Oldest first</option>
            <option value="az">Name A–Z</option>
            <option value="za">Name Z–A</option>
          </select>
          <button class="btn btn-ghost" id="clearFilters">Clear</button>
        </div>

        <!-- count + list -->
        <div class="section-head reveal">
          <div>
            <h2 id="resultTitle">All subdomains</h2>
            <div class="sub" id="resultCount"></div>
          </div>
        </div>

        <div id="listWrap"></div>
      </main>
    </div>
  </div>

  <!-- Add / Edit modal -->
  <div id="modal-form" class="modal-backdrop">
    <div class="modal">
      <div class="modal-head">
        <h3 id="formTitle">Add subdomain</h3>
        <button class="modal-close" data-close="modal-form"></button>
      </div>
      <form id="subForm">
        <input type="hidden" id="editId">
        <div class="form-group">
          <label>Subdomain name</label>
          <div class="input-prefix">
            <span class="prefix" id="prefix"></span>
            <input class="input" id="fName" placeholder="blog" autocomplete="off">
          </div>
          <div class="hint">Letters, numbers, hyphens only.</div>
        </div>
        <div class="form-group">
          <label>Project name</label>
          <input class="input" id="fProject" placeholder="My Blog">
        </div>
        <div class="form-group">
          <label>GitHub repository</label>
          <input class="input" id="fRepo" placeholder="username/repo">
          <div class="hint">Repo that hosts this website on GitHub Pages.</div>
          <div class="hint" id="formPrice" style="color:var(--c1)"></div>
        </div>
        <div class="form-group">
          <label>Status</label>
          <select class="input" id="fStatus">
            <option value="draft">Draft</option>
            <option value="pending">Pending</option>
            <option value="live">Live</option>
          </select>
        </div>
        <div class="form-group">
          <label>Notes</label>
          <textarea class="textarea" id="fDesc" placeholder="Optional notes about this site"></textarea>
        </div>
        <div class="form-actions">
          <button type="button" class="btn btn-ghost" data-close="modal-form">Cancel</button>
          <button type="submit" class="btn btn-primary" id="formSubmit">Save</button>
        </div>
      </form>
    </div>
  </div>

  <!-- delete confirm modal -->
  <div id="modal-delete" class="modal-backdrop">
    <div class="modal" style="max-width:420px">
      <div class="modal-head">
        <h3>Delete subdomain</h3>
        <button class="modal-close" data-close="modal-delete"></button>
      </div>
      <p style="font-size:14px;color:var(--muted-fg)">Are you sure you want to delete <strong id="delName" style="color:var(--foreground)"></strong>? This cannot be undone.</p>
      <div class="form-actions">
        <button class="btn btn-ghost" data-close="modal-delete">Cancel</button>
        <button class="btn btn-danger" id="confirmDelete">Delete</button>
      </div>
    </div>
  </div>

  <script src="js/firebase-init.js?v=4"></script>
  <script src="js/data.js?v=4"></script>
  <script src="js/auth.js?v=4"></script>
  <script src="js/app.js?v=4"></script>
  <script src="js/cloudflare.js?v=4"></script>
  <script src="js/fx.js?v=4"></script>
  <script src="js/subdomains.js?v=4"></script>
</body>
</html>
