<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b1120">
  <title>SubManga — Register</title>
  <link rel="stylesheet" href="css/styles.css?v=4">
</head>
<body>
  <div class="aurora">
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
    <div class="blob blob-4"></div>
  </div>

  <div class="auth-wrap">
    <div class="auth-card" id="regCard">
      <div class="auth-logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 2l8 4v6c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10V6l8-4z"/><path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4" stroke="white" stroke-width="2.2"/></svg></div>
      <h2>Create <span>account</span></h2>
      <p class="sub">Free signup with bonus credits.</p>
      <form id="regForm">
        <div class="form-group">
          <label>Email (Gmail)</label>
          <input class="input" id="regEmail" type="email" placeholder="e.g. name@gmail.com" autocomplete="email" required>
          <div class="hint">Used for login.</div>
        </div>
        <div class="form-group">
          <label>Username</label>
          <input class="input" id="regUser" type="text" placeholder="a-z, 0-9, _ (3-16 chars)" autocomplete="username" required>
          <div class="hint">a-z, 0-9, _ only.</div>
        </div>
        <div class="form-group">
          <label>Display name</label>
          <input class="input" id="regDisplay" type="text" placeholder="Tumhara naam">
        </div>
        <div class="form-group">
          <label>Password</label>
          <div style="position:relative">
            <input class="input" id="regPass" type="password" placeholder="Min 6 chars" autocomplete="new-password" required style="padding-right:52px">
            <button type="button" id="regToggle" style="position:absolute;right:8px;top:50%;transform:translateY(-50%);background:none;border:none;color:var(--muted-fg);font-size:12px;font-weight:700;cursor:pointer">SHOW</button>
          </div>
        </div>
        <button class="btn btn-primary" id="regSubmit" type="submit" style="width:100%;margin-top:8px">Register &amp; claim bonus</button>
        <div class="login-error" id="regError"></div>
      </form>
      <div class="auth-switch">Have an account? <a href="login.html">Login</a></div>
      <div class="auth-switch"><a href="index.html">← Browse without login</a></div>
    </div>
  </div>

  <script src="js/firebase-init.js?v=4"></script>
  <script src="js/data.js?v=4"></script>
  <script src="js/auth.js?v=4"></script>
  <script src="js/register.js?v=4"></script>
</body>
</html>
